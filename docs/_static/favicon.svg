  <g transform="translate(4.5 4)">
    <polyline points="3,14 12,5 21,14" fill="none" stroke="#2ee6b0" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter"/>
    <polyline points="3,22 12,13 21,22" fill="none" stroke="#ffe94a" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
</svg>
