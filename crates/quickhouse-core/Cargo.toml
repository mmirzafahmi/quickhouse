[package]
name = "quickhouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core engine for quickhouse: parallel, bounded-memory, Arrow-based streaming ETL from PostgreSQL/MySQL/BigQuery and CleverTap/AppsFlyer APIs into ClickHouse or BigQuery."
readme = "../../README.md"
keywords = ["etl", "clickhouse", "bigquery", "arrow", "data-pipeline"]
categories = ["database"]
# Distributed only as the `quickhouse` Python wheel today. Flip to publish this
# engine as a standalone crate (metadata above is ready for it).
publish = false

[dependencies]
tokio.workspace = true
tokio-postgres.workspace = true
futures.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
reqwest.workspace = true
bytes.workspace = true
tokio-util.workspace = true
async-compression.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rustls.workspace = true
tokio-postgres-rustls.workspace = true
webpki-roots.workspace = true
rustls-pemfile.workspace = true
mysql_async.workspace = true
google-cloud-bigquery.workspace = true
google-cloud-googleapis.workspace = true
google-cloud-gax.workspace = true
time.workspace = true
base64.workspace = true
prost.workspace = true
prost-types.workspace = true
parquet.workspace = true
object_store.workspace = true
csv.workspace = true
async-trait = "0.1"

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
