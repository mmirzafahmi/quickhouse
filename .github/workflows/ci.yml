# Fast feedback on every push/PR: a lint gate, Rust unit tests, and the pytest
# integration suite against real Postgres/MySQL/ClickHouse/MinIO containers,
# across the minimum-supported and a recent Python. Full multi-platform wheel
# builds only happen in release.yml, on tags.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust unit tests
        run: cargo test -p quickhouse-core

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the extension (debug, fast)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --out dist -i python${{ matrix.python-version }}
          manylinux: auto

      - name: Install quickhouse + full test deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --find-links dist --no-index quickhouse
          # Mirror the [test] extra without triggering a source rebuild, so the
          # MySQL and S3-archive suites actually run (not importorskip'd).
          pip install pytest 'psycopg[binary]>=3.1' 'pymysql>=1.1' \
            'clickhouse-connect>=0.7' 'tqdm>=4.60' 'boto3>=1.34' 'pyarrow>=14'

      - name: Start Postgres + MySQL + ClickHouse + MinIO
        run: docker compose up -d --wait

      - name: pytest
        run: |
          source .venv/bin/activate
          pytest -v
